name: EscaneoLidar
options:
  bundleIdPrefix: com.alemarcheco
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EscaneoLidar:
    type: application
    platform: iOS
    sources:
      - EscaneoLidar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alemarcheco.escaneo3d
        PRODUCT_NAME: EscaneoLidar
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EscaneoLidar/Info.plist
    info:
      path: EscaneoLidar/Info.plist
      properties:
        CFBundleDisplayName: "Escáner 3D"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "La cámara y el sensor LiDAR se usan para escanear en 3D."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
